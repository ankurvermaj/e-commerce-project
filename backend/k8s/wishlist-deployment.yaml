apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist-service
  namespace: ecom-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wishlist-service
  template:
    metadata:
      labels:
        app: wishlist-service
    spec:
      containers:
        - name: wishlist-service
          image: backend-wishlist_service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8007
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: MONGO_URI
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: SECRET_KEY
            - name: WISHLIST_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: WISHLIST_DB_NAME
            - name: PRODUCT_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PRODUCT_DB_NAME
            - name: ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ALGORITHM

