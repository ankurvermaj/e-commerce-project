apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: backend-order_service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8004
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: MONGO_URI
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: SECRET_KEY
            - name: ORDER_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ORDER_DB_NAME
            - name: PRODUCT_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PRODUCT_DB_NAME
            - name: ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ALGORITHM
            - name: CART_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: CART_SERVICE_URL
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PRODUCT_SERVICE_URL

