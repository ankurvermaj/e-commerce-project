apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecom-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: backend-auth_service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: MONGO_URI
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: SECRET_KEY
            - name: AUTH_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: AUTH_DB_NAME
            - name: ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES