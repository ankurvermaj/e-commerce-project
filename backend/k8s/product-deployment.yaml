apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecom-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: backend-product_service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: MONGO_URI
            - name: PRODUCT_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PRODUCT_DB_NAME
            - name: ORDER_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ORDER_DB_NAME

