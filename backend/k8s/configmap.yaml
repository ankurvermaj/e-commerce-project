apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ecom-microservices
data:
  # Internal Kubernetes DNS URLs for service-to-service communication
  AUTH_SERVICE_URL: "http://auth-service:8001"
  PRODUCT_SERVICE_URL: "http://product-service:8002"
  CART_SERVICE_URL: "http://cart-service:8003"
  ORDER_SERVICE_URL: "http://order-service:8004"
  ADMIN_SERVICE_URL: "http://admin-service:8005"
  REVIEW_SERVICE_URL: "http://review-service:8006"
  WISHLIST_SERVICE_URL: "http://wishlist-service:8007"
  TICKET_SERVICE_URL: "http://ticket-service:8008"

  # Gateway CORS configuration
  CORS_ORIGINS: "*"

  # Non-sensitive MongoDB database names and JWT settings
  AUTH_DB_NAME: "auth_db"
  PRODUCT_DB_NAME: "product_db"
  CART_DB_NAME: "cart_db"
  ORDER_DB_NAME: "order_db"
  REVIEW_DB_NAME: "review_db"
  WISHLIST_DB_NAME: "wishlist_db"
  TICKET_DB_NAME: "ticket_db"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

